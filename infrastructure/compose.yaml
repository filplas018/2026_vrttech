name: vrttech-dev

services:
  web:
    image: django-chat-app
    container_name: vrttech_web
    build:
      context: ../server
      dockerfile: Dockerfile
      target: development
    volumes:
      - ../server:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
      - proxy-net

  client:
    image: react-chat-app
    container_name: vrttech_client
    build:
      context: ../client
      dockerfile: Dockerfile
      target: development
    
    volumes:
      - ../client:/app
      - client_node_modules:/app/node_modules
    networks:
      - app-network
      - proxy-net

  db:
    image: postgres:18.3-alpine
    container_name: vrttech_db
    ports:
      - "5434:5432" # Změněno na 5434 pro zabránění kolize s KNS databází (5433)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: vrttech_redis
    expose:
      - "6379"
    networks:
      - app-network

volumes:
  postgres_data:
  client_node_modules:

networks:
  app-network:
    driver: bridge
  proxy-net:
    external: true