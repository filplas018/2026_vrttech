name: Deploy 2026_vrttech to Hetzner VPS

on:
  push:
    branches:
      - main  # Spustí se automaticky po pushnutí do větve main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Krok: Stáhne kód z repozitáře
      - name: Checkout kódu z repozitáře
        uses: actions/checkout@v4

      # 2. Krok: Zkopíruje potřebné složky na server
      - name: Kopírování souborů na server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "client/,server/,infrastructure/"
          target: "/home/deployer/2026_vrttech"
          overwrite: true

      # 3. Krok: Přihlášení přes SSH, zápis .env a plynulý rebuild
      - name: Spuštění aplikace na serveru (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deployer/2026_vrttech

            # Zápis .env do infrastructure/ a vytvoření kopie v kořeni projektu
            mkdir -p infrastructure
            cat << 'EOF' > infrastructure/.env
            ${{ secrets.PRODUCTION_ENV }}
            EOF
            cp infrastructure/.env .env

            # Plynulý rebuild a restart s odkazem na produkční compose a správný .env
            docker compose -f infrastructure/compose.prod.yaml --env-file infrastructure/.env up -d --build --remove-orphans

            # Pročištění neaktivních Docker imagí pro úsporu disku
            docker image prune -f